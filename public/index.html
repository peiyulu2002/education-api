<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90D9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pretty English">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Pretty English</title>
<style>
  :root {
    --primary: #4A90D9; --primary-dark: #3A7BC8; --primary-light: #E8F1FB;
    --danger: #E74C3C; --danger-light: #FDECEA;
    --success: #27AE60; --success-light: #E8F8F0;
    --warning: #F39C12; --warning-light: #FEF5E7;
    --text-main: #2C3E50; --text-sub: #7F8C8D; --text-light: #BDC3C7;
    --bg-page: #F5F6F8; --bg-card: #FFFFFF;
    --border: #ECEEF0; --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg-page); color:var(--text-main); font-size:15px; line-height:1.5; }

  /* ===== App Layout ===== */
  #app { display:flex; flex-direction:column; min-height:100vh; }

  /* Top bar */
  .topbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); }
  .topbar-title { font-size:17px; font-weight:700; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .lang-switch { display:flex; gap:2px; }
  .lang-switch button { background:transparent; border:1px solid var(--border); border-radius:4px; padding:2px 8px; font-size:11px; color:var(--text-sub); cursor:pointer; }
  .lang-switch button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  /* Pages */
  .page-area { flex:1; padding-bottom:70px; overflow-y:auto; }
  .page { display:none; }
  .page.active { display:block; }

  /* Cards */
  .card { background:#fff; border-radius:var(--radius); margin:12px 16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .card-title { font-size:16px; font-weight:700; margin-bottom:12px; }
  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

  /* Buttons */
  .btn { padding:10px 16px; border:none; border-radius:10px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--primary); color:#fff; } .btn-primary:active { background:var(--primary-dark); }
  .btn-success { background:var(--success); color:#fff; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text-sub); }
  .btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
  .btn-block { width:100%; justify-content:center; padding:14px; font-size:15px; }
  .add-fab { position:fixed; bottom:80px; right:16px; width:52px; height:52px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:24px; box-shadow:0 4px 16px rgba(74,144,217,0.4); cursor:pointer; z-index:100; display:flex; align-items:center; justify-content:center; }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 16px; }
  .stat-card { background:#fff; border-radius:var(--radius); padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .stat-label { font-size:12px; color:var(--text-sub); margin-bottom:6px; }
  .stat-value { font-size:24px; font-weight:700; }
  .stat-value.danger { color:var(--danger); } .stat-value.success { color:var(--success); }

  /* List items (replacing tables) */
  .list-item { background:#fff; border-radius:var(--radius); margin:0 16px 8px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .li-row { display:flex; justify-content:space-between; align-items:center; }
  .li-main { flex:1; }
  .li-title { font-size:15px; font-weight:600; }
  .li-sub { font-size:12px; color:var(--text-sub); margin-top:3px; }
  .li-right { text-align:right; }
  .li-actions { display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }

  /* Badge */
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; display:inline-block; }
  .badge-warning { background:var(--warning-light); color:var(--warning); }
  .badge-danger { background:var(--danger-light); color:var(--danger); }
  .badge-success { background:var(--success-light); color:var(--success); }
  .badge-info { background:var(--primary-light); color:var(--primary); }

  /* Search */
  .search-bar { margin:0 16px 12px; }
  .search-bar input { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#fff; }
  .search-bar input:focus { border-color:var(--primary); }

  /* Filter chips */
  .chip-row { display:flex; gap:8px; margin:0 16px 12px; overflow-x:auto; }
  .chip { padding:6px 14px; border-radius:16px; font-size:13px; white-space:nowrap; cursor:pointer; background:#fff; border:1px solid var(--border); color:var(--text-sub); }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  /* Empty */
  .empty { text-align:center; padding:48px 20px; color:var(--text-light); font-size:14px; }

  /* Bottom Sheet (modal) */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:24px 20px 40px; max-height:85vh; overflow-y:auto; }
  .sheet h3 { font-size:17px; margin-bottom:20px; text-align:center; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; color:var(--text-sub); margin-bottom:6px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#fff; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
  .form-group textarea { resize:vertical; min-height:60px; }
  .form-row { display:flex; gap:10px; } .form-row .form-group { flex:1; }
  .sheet-actions { display:flex; gap:10px; margin-top:20px; }
  .sheet-actions .btn { flex:1; justify-content:center; padding:14px; }

  /* Calendar */
  .cal-toolbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .cal-nav { display:flex; align-items:center; gap:8px; }
  .cal-nav button { background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; }
  .cal-month-label { font-size:16px; font-weight:700; min-width:100px; text-align:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin:0 16px; border-radius:10px; overflow:hidden; }
  .cal-wd { background:var(--bg-page); padding:8px 4px; text-align:center; font-size:12px; font-weight:600; color:var(--text-sub); }
  .cal-day { background:#fff; min-height:56px; padding:4px; cursor:pointer; position:relative; }
  .cal-day.other { opacity:.3; }
  .cal-day.today { background:var(--primary-light); }
  .cal-day-num { font-size:13px; font-weight:600; }
  .cal-ev { font-size:9px; padding:1px 4px; border-radius:3px; margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .cal-ev.lesson { background:#D6E4FF; color:#1A5BB5; }
  .cal-ev.trial { background:#FFF0D6; color:#B5771A; }
  .cal-ev.visit { background:#E8F8F0; color:#1A7B43; }
  .cal-legend { display:flex; gap:12px; margin:8px 16px 12px; font-size:11px; color:var(--text-sub); }
  .cal-legend span { display:flex; align-items:center; gap:3px; }
  .cal-legend .dot { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* Tab Bar */
  .tab-bar { position:fixed; bottom:0; left:0; right:0; height:64px; background:#fff; border-top:1px solid var(--border); display:flex; z-index:90; }
  .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--text-light); }
  .tab-item.active { color:var(--primary); }
  .tab-icon { font-size:22px; line-height:1; }
  .tab-label { font-size:10px; }

  /* Detail sheet */
  .detail-info { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:16px; }
  .detail-info .full { grid-column:span 2; }
  .detail-label { font-size:12px; color:var(--text-sub); }
  .detail-value { font-size:14px; font-weight:500; }
  .detail-box { background:var(--bg-page); padding:10px 12px; border-radius:8px; }
  .sub-list { margin-top:16px; }
  .sub-list-title { font-size:14px; font-weight:600; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .sub-list-item { padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:13px; }
  .sub-list-item:last-child { border:none; }
</style>
</head>
<body>

<!-- Login removed: app opens directly into the main interface -->

<!-- ===== App ===== -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">工作台</div>
      <div class="topbar-right">
        <div class="lang-switch"><button id="langZh" class="active" onclick="setLang('zh')">中</button><button id="langEn" onclick="setLang('en')">EN</button></div>
      </div>
  </div>

  <div class="page-area">
    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label" id="sL1">学员总数</div><div class="stat-value" id="statStudents">0</div></div>
        <div class="stat-card"><div class="stat-label" id="sL2">本月排课</div><div class="stat-value" id="statLessons">0</div></div>
        <div class="stat-card"><div class="stat-label" id="sL3">累计收费</div><div class="stat-value success" id="statRevenue">¥0</div></div>
        <div class="stat-card"><div class="stat-label" id="sL4">课时预警</div><div class="stat-value danger" id="statWarning">0</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title" id="warnTitle">课时预警</div><button class="btn btn-outline btn-sm" id="viewAllBtn" onclick="switchTab('students')">全部</button></div>
        <div id="warningList"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title" id="todayTitle">今日课程</div></div>
        <div id="todayLessons"></div>
      </div>
    </div>

    <!-- Students -->
    <div class="page" id="page-students">
      <div style="padding:12px 16px 8px; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:17px; font-weight:700;" id="stuTitle">学员档案</div>
        <button class="btn btn-primary btn-sm" id="addStuBtn" onclick="openStudentModal()">+ 新增</button>
      </div>
      <div class="search-bar"><input type="text" id="stuSearch" placeholder="搜索姓名/地址..." oninput="renderStudents()"></div>
      <div id="stuList"></div>
    </div>

    <!-- Billing -->
    <div class="page" id="page-billing">
      <div style="padding:12px 16px 8px; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-size:17px; font-weight:700;" id="bilTitle">课时收费</div>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-success btn-sm" id="purBtn" onclick="openPurchaseModal()">+ 购课</button>
          <button class="btn btn-primary btn-sm" id="dedBtn" onclick="openDeductModal()">+ 扣课</button>
        </div>
      </div>
      <div class="search-bar"><input type="text" id="bilSearch" placeholder="搜索学员..." oninput="renderBilling()"></div>
      <div id="bilList"></div>
      <div style="margin:20px 16px 12px; font-size:15px; font-weight:700;" id="payTitle2">收费记录</div>
      <div class="search-bar"><input type="text" id="paySearch" placeholder="搜索学员..." oninput="renderPayments()"></div>
      <div id="payList"></div>
    </div>

    <!-- Calendar -->
    <div class="page" id="page-calendar">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="calPrev" onclick="changeMonth(-1)">‹</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button id="calNext" onclick="changeMonth(1)">›</button>
        </div>
        <div style="display:flex; gap:4px;">
          <button class="btn btn-primary btn-sm" id="addLessonBtn" onclick="openEventModal('','lesson')">课</button>
          <button class="btn btn-outline btn-sm" id="addTrialBtn" onclick="openEventModal('','trial')">试</button>
          <button class="btn btn-outline btn-sm" id="addVisitBtn" onclick="openEventModal('','visit')">访</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><span class="dot" style="background:#D6E4FF"></span><span id="lgLesson">课程</span></span>
        <span><span class="dot" style="background:#FFF0D6"></span><span id="lgTrial">试听</span></span>
        <span><span class="dot" style="background:#E8F8F0"></span><span id="lgVisit">回访</span></span>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" data-page="dashboard" onclick="switchTab('dashboard')"><span class="tab-icon">🏠</span><span class="tab-label" id="tb1">工作台</span></div>
    <div class="tab-item" data-page="students" onclick="switchTab('students')"><span class="tab-icon">👤</span><span class="tab-label" id="tb2">学员</span></div>
    <div class="tab-item" data-page="billing" onclick="switchTab('billing')"><span class="tab-icon">💰</span><span class="tab-label" id="tb3">收费</span></div>
    <div class="tab-item" data-page="calendar" onclick="switchTab('calendar')"><span class="tab-icon">📅</span><span class="tab-label" id="tb4">日历</span></div>
  </div>
</div>

<div id="sheetContainer"></div>

<script>
/* ===== i18n ===== */
const I18N = {
  appTitle:{zh:'Pretty English',en:'Pretty English'},
  logout:{zh:'退出',en:'Logout'},
  nav_dashboard:{zh:'工作台',en:'Dashboard'},nav_students:{zh:'学员',en:'Students'},nav_billing:{zh:'收费',en:'Billing'},nav_calendar:{zh:'日历',en:'Calendar'},
  stat_students:{zh:'学员总数',en:'Students'},stat_lessons:{zh:'本月排课',en:'This Month'},stat_revenue:{zh:'累计收费',en:'Revenue'},stat_warning:{zh:'课时预警',en:'Low Hours'},
  warnTitle:{zh:'课时预警',en:'Low-Hour Alerts'},viewAll:{zh:'全部',en:'All'},todayTitle:{zh:'今日课程',en:"Today's Classes"},noWarn:{zh:'暂无预警',en:'No alerts'},noToday:{zh:'今日无安排',en:'Nothing today'},
  stuTitle:{zh:'学员档案',en:'Students'},addStudent:{zh:'+ 新增',en:'+ Add'},searchStu:{zh:'搜索姓名/地址...',en:'Search...'},noStu:{zh:'暂无学员',en:'No students'},
  name:{zh:'姓名',en:'Name'},grade:{zh:'年级',en:'Grade'},address:{zh:'地址',en:'Address'},remaining:{zh:'剩余课时',en:'Remaining'},used:{zh:'已用',en:'Used'},status:{zh:'状态',en:'Status'},
  edit:{zh:'编辑',en:'Edit'},delete:{zh:'删除',en:'Delete'},detail:{zh:'详情',en:'Detail'},buy:{zh:'购课',en:'Buy'},deduct:{zh:'扣课',en:'Deduct'},
  addStu:{zh:'新增学员',en:'Add Student'},editStu:{zh:'编辑学员',en:'Edit Student'},fName:{zh:'姓名 *',en:'Name *'},fGrade:{zh:'年级',en:'Grade'},fAddress:{zh:'家庭住址',en:'Address'},fAddressPh:{zh:'如：朝阳区望京',en:'e.g. Chaoyang'},fNeed:{zh:'客户需求',en:'Needs'},fNeedPh:{zh:'如：提高英语阅读',en:'e.g. Reading'},fFeedback:{zh:'沟通备注',en:'Notes'},fFeedbackPh:{zh:'沟通记录',en:'Notes'},cancel:{zh:'取消',en:'Cancel'},save:{zh:'保存',en:'Save'},close:{zh:'关闭',en:'Close'},enterName:{zh:'请输入姓名',en:'Enter name'},confirmDelStu:{zh:'确认删除该学员？',en:'Delete student?'},
  g_nursery:{zh:'托班',en:'Nursery'},g_kindergarten:{zh:'幼儿园',en:'Kindergarten'},g_primary13:{zh:'小学1-3年级',en:'Primary 1-3'},g_primary36:{zh:'小学3-6年级',en:'Primary 4-6'},g_junior:{zh:'初中',en:'Junior High'},g_senior:{zh:'高中',en:'Senior High'},g_adult:{zh:'成人',en:'Adult'},
  stuDetail:{zh:'学员详情',en:'Detail'},dRemaining:{zh:'剩余',en:'Remaining'},dPaid:{zh:'累计付费',en:'Paid'},dUsed:{zh:'累计上课',en:'Used'},lessonRecords:{zh:'📝 上课记录',en:'📝 Lessons'},purchaseRecords:{zh:'💰 购课记录',en:'💰 Purchases'},noLessonRec:{zh:'暂无上课记录',en:'No lessons'},noPurRec:{zh:'暂无购课记录',en:'No purchases'},none:{zh:'暂无',en:'None'},
  bilTitle:{zh:'课时收费',en:'Billing'},addPur:{zh:'+ 购课',en:'+ Buy'},addDed:{zh:'+ 扣课',en:'+ Deduct'},searchStu2:{zh:'搜索学员...',en:'Search...'},noStu2:{zh:'暂无学员',en:'No students'},totalPaid:{zh:'总额',en:'Total'},totalHrs:{zh:'总课时',en:'Hours'},unit:{zh:'单价',en:'Unit'},perHr:{zh:'/课时',en:'/hr'},
  bNoHrs:{zh:'已无课时',en:'No Hours'},bLow:{zh:'课时不足',en:'Low'},bNormal:{zh:'正常',en:'OK'},bNotPur:{zh:'未购课',en:'None'},
  payTitle:{zh:'收费记录',en:'Payments'},noPay:{zh:'暂无记录',en:'No records'},
  purTitle:{zh:'购课录入',en:'New Purchase'},fStudent:{zh:'学员 *',en:'Student *'},fAmount:{zh:'金额(¥) *',en:'Amount(¥) *'},fHrs:{zh:'总课时 *',en:'Hours *'},fNote:{zh:'备注',en:'Note'},enterAmt:{zh:'请输入金额',en:'Enter amount'},enterHrs:{zh:'请输入课时',en:'Enter hours'},addStuFirst:{zh:'请先添加学员',en:'Add student first'},remHrs:{zh:'剩余',en:'Rem'},
  dedTitle:{zh:'上课扣课',en:'Deduct'},fDedHrs:{zh:'扣除课时 *',en:'Hours *'},fLesDate:{zh:'上课日期',en:'Date'},confirm:{zh:'确认',en:'OK'},notEnough:{zh:'课时不足！剩余',en:'Not enough! Rem'},
  prevM:{zh:'‹',en:'‹'},nextM:{zh:'›',en:'›'},lgLesson:{zh:'课程',en:'Lesson'},lgTrial:{zh:'试听',en:'Trial'},lgVisit:{zh:'回访',en:'Follow-up'},
  evLesson:{zh:'课程',en:'Lesson'},evTrial:{zh:'试听',en:'Trial'},evVisit:{zh:'回访',en:'Follow-up'},evAdd:{zh:'新增',en:'Add'},evEdit:{zh:'编辑',en:'Edit'},fType:{zh:'类型',en:'Type'},fBind:{zh:'学员',en:'Student'},noBind:{zh:'不绑定',en:'None'},fDate:{zh:'日期 *',en:'Date *'},fTime:{zh:'时间',en:'Time'},fTitle:{zh:'标题',en:'Title'},fTitlePh:{zh:'如：英语阅读课',en:'e.g. Reading'},selDate:{zh:'请选择日期',en:'Select date'},confirmDelEv:{zh:'删除此事件？',en:'Delete event?'},
  date:{zh:'日期',en:'Date'},amount:{zh:'金额',en:'Amount'},hours:{zh:'课时',en:'Hours'},note:{zh:'备注',en:'Note'},deleted:{zh:'已删除',en:'Deleted'},lessonUnit:{zh:'课时',en:'hrs'},sessions:{zh:'次',en:'x'},yearSuffix:{zh:'年',en:''},loading:{zh:'加载中...',en:'Loading...'},saveErr:{zh:'保存失败',en:'Save failed'},delErr:{zh:'删除失败',en:'Delete failed'},
};
let LANG = localStorage.getItem('lang')||'zh';
function t(k){const e=I18N[k];return e?(e[LANG]||e.zh||k):k;}
function setLang(l){LANG=l;localStorage.setItem('lang',l);applyLang();}

function applyLang(){
  const $=id=>document.getElementById(id);
  $('langZh').classList.toggle('active',LANG==='zh');$('langEn').classList.toggle('active',LANG==='en');
  $('sL1').textContent=t('stat_students');$('sL2').textContent=t('stat_lessons');$('sL3').textContent=t('stat_revenue');$('sL4').textContent=t('stat_warning');
  $('warnTitle').textContent=t('warnTitle');$('viewAllBtn').textContent=t('viewAll');$('todayTitle').textContent=t('todayTitle');
  $('stuTitle').textContent=t('stuTitle');$('addStuBtn').textContent=t('addStudent');$('stuSearch').placeholder=t('searchStu');
  $('bilTitle').textContent=t('bilTitle');$('purBtn').textContent=t('addPur');$('dedBtn').textContent=t('addDed');$('bilSearch').placeholder=t('searchStu2');$('payTitle2').textContent=t('payTitle');$('paySearch').placeholder=t('searchStu2');
  $('addLessonBtn').textContent=t('evLesson').slice(0,1);$('addTrialBtn').textContent=t('evTrial').slice(0,1);$('addVisitBtn').textContent=t('evVisit').slice(0,1);
  $('lgLesson').textContent=t('lgLesson');$('lgTrial').textContent=t('lgTrial');$('lgVisit').textContent=t('lgVisit');
  $('tb1').textContent=t('nav_dashboard');$('tb2').textContent=t('nav_students');$('tb3').textContent=t('nav_billing');$('tb4').textContent=t('nav_calendar');
  const active=document.querySelector('.page.active')?.id?.replace('page-','');
  const titles={dashboard:t('nav_dashboard'),students:t('nav_students'),billing:t('nav_billing'),calendar:t('nav_calendar')};
  $('topbarTitle').textContent=titles[active]||'';

/* ===== Calendar ===== */
let calDate=new Date();
function renderCalendar(){
  const y=calDate.getFullYear(),m=calCursorGetMonth();
  const mn=LANG==='zh'?['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('calMonthLabel').textContent=y+t('yearSuffix')+' '+mn[m];
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate(),daysInPrev=new Date(y,m,0).getDate();
  const wd=LANG==='zh'?['日','一','二','三','四','五','六']:['S','M','T','W','T','F','S'];
  let html='';wd.forEach(d=>html+='<div class="cal-wd">'+d+'</div>');
  const todayStr=new Date().toISOString().slice(0,10);
  for(let i=firstDay-1;i>=0;i--)html+='<div class="cal-day other"><div class="cal-day-num">'+(daysInPrev-i)+'</div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs=_events.filter(e=>e.date===ds);
    let evHtml=evs.slice(0,2).map(e=>{const cls=e.type==='lesson'?'lesson':e.type==='trial'?'trial':'visit';const sn=e.student_name||e.title||'';return '<div class="cal-ev '+cls+'">'+(e.time||'')+' '+sn+'</div>';}).join('');
    html+='<div class="cal-day '+(ds===todayStr?'today':'')+'" onclick="openEventModal(\'\',\'lesson\',\''+ds+'\')"><div class="cal-day-num">'+d+'</div>'+evHtml+'</div>';
  }
  const rem=(7-((firstDay+daysInMonth)%7))%7;
  for(let i=1;i<=rem;i++)html+='<div class="cal-day other"><div class="cal-day-num">'+i+'</div></div>';
  document.getElementById('calGrid').innerHTML=html;
}
function calCursorGetMonth(){return calDate.getMonth();}
function changeMonth(d){calDate.setMonth(calDate.getMonth()+d);renderCalendar();}
