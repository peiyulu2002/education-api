<style>
  :root {
    --primary: #4A90D9; --primary-dark: #3A7BC8; --primary-light: #E8F1FB;
    --danger: #E74C3C; --danger-light: #FDECEA;
    --success: #27AE60; --success-light: #E8F8F0;
    --warning: #F39C12; --warning-light: #FEF5E7;
    --text-main: #2C3E50; --text-sub: #7F8C8D; --text-light: #BDC3C7;
    --bg-page: #F5F6F8; --bg-card: #FFFFFF;
    --border: #ECEEF0; --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg-page); color:var(--text-main); font-size:15px; line-height:1.5; }

  /* ===== Login ===== */
  #loginPage { position:fixed; inset:0; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; z-index:9999; }
  .login-box { background:#fff; border-radius:20px; padding:36px 28px; width:90%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,0.3); text-align:center; }
  .login-box .logo { font-size:48px; margin-bottom:12px; }
  .login-box h2 { font-size:20px; margin-bottom:6px; }
  .login-box .sub { color:var(--text-sub); margin-bottom:24px; font-size:13px; }
  .login-box input { width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:10px; font-size:15px; margin-bottom:12px; outline:none; }
  .login-box input:focus { border-color:var(--primary); }
  .login-box .btn-login { width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; cursor:pointer; }
  .login-box .btn-login:active { background:var(--primary-dark); }
  .login-hint { margin-top:14px; font-size:12px; color:#fff; opacity:.85; }
  .login-err { color:var(--danger); font-size:12px; margin-top:8px; min-height:14px; }
  .lang-switch-login { margin-top:18px; display:flex; justify-content:center; gap:4px; }
  .lang-switch-login button { background:transparent; border:1px solid rgba(255,255,255,.6); border-radius:6px; padding:4px 14px; font-size:12px; color:#fff; cursor:pointer; }
  .lang-switch-login button.active { background:#fff; color:var(--primary); border-color:#fff; }

  /* ===== App Layout ===== */
  #app { display:none; flex-direction:column; min-height:100vh; }

  /* Top bar */
  .topbar { height:52px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); }
  .topbar-title { font-size:17px; font-weight:700; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .lang-switch { display:flex; gap:2px; }
  .lang-switch button { background:transparent; border:1px solid var(--border); border-radius:4px; padding:2px 8px; font-size:11px; color:var(--text-sub); cursor:pointer; }
  .lang-switch button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .logout-btn { color:var(--danger); font-size:13px; cursor:pointer; background:none; border:none; }

  /* Pages */
  .page-area { flex:1; padding-bottom:70px; overflow-y:auto; }
  .page { display:none; }
  .page.active { display:block; }

  /* Cards */
  .card { background:#fff; border-radius:var(--radius); margin:12px 16px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .card-title { font-size:16px; font-weight:700; margin-bottom:12px; }
  .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

  /* Buttons */
  .btn { padding:10px 16px; border:none; border-radius:10px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--primary); color:#fff; } .btn-primary:active { background:var(--primary-dark); }
  .btn-success { background:var(--success); color:#fff; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text-sub); }
  .btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
  .btn-block { width:100%; justify-content:center; padding:14px; font-size:15px; }
  .add-fab { position:fixed; bottom:80px; right:16px; width:52px; height:52px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:24px; box-shadow:0 4px 16px rgba(74,144,217,0.4); cursor:pointer; z-index:100; display:flex; align-items:center; justify-content:center; }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 16px; }
  .stat-card { background:#fff; border-radius:var(--radius); padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .stat-label { font-size:12px; color:var(--text-sub); margin-bottom:6px; }
  .stat-value { font-size:24px; font-weight:700; }
  .stat-value.danger { color:var(--danger); } .stat-value.success { color:var(--success); }

  /* List items (replacing tables) */
  .list-item { background:#fff; border-radius:var(--radius); margin:0 16px 8px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .li-row { display:flex; justify-content:space-between; align-items:center; }
  .li-main { flex:1; }
  .li-title { font-size:15px; font-weight:600; }
  .li-sub { font-size:12px; color:var(--text-sub); margin-top:3px; }
  .li-right { text-align:right; }
  .li-actions { display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }

  /* Badge */
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500; display:inline-block; }
  .badge-warning { background:var(--warning-light); color:var(--warning); }
  .badge-danger { background:var(--danger-light); color:var(--danger); }
  .badge-success { background:var(--success-light); color:var(--success); }
  .badge-info { background:var(--primary-light); color:var(--primary); }

  /* Search */
  .search-bar { margin:0 16px 12px; }
  .search-bar input { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#fff; }
  .search-bar input:focus { border-color:var(--primary); }

  /* Filter chips */
  .chip-row { display:flex; gap:8px; margin:0 16px 12px; overflow-x:auto; }
  .chip { padding:6px 14px; border-radius:16px; font-size:13px; white-space:nowrap; cursor:pointer; background:#fff; border:1px solid var(--border); color:var(--text-sub); }
  .chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

  /* Empty */
  .empty { text-align:center; padding:48px 20px; color:var(--text-light); font-size:14px; }

  /* Bottom Sheet (modal) */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:24px 20px 40px; max-height:85vh; overflow-y:auto; }
  .sheet h3 { font-size:17px; margin-bottom:20px; text-align:center; }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; color:var(--text-sub); margin-bottom:6px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; background:#fff; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
  .form-group textarea { resize:vertical; min-height:60px; }
  .form-row { display:flex; gap:10px; } .form-row .form-group { flex:1; }
  .sheet-actions { display:flex; gap:10px; margin-top:20px; }
  .sheet-actions .btn { flex:1; justify-content:center; padding:14px; }

  /* Calendar */
  .cal-toolbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .cal-nav { display:flex; align-items:center; gap:8px; }
  .cal-nav button { background:#fff; border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; }
  .cal-month-label { font-size:16px; font-weight:700; min-width:100px; text-align:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin:0 16px; border-radius:10px; overflow:hidden; }
  .cal-wd { background:var(--bg-page); padding:8px 4px; text-align:center; font-size:12px; font-weight:600; color:var(--text-sub); }
  .cal-day { background:#fff; min-height:56px; padding:4px; cursor:pointer; position:relative; }
  .cal-day.other { opacity:.3; }
  .cal-day.today { background:var(--primary-light); }
  .cal-day-num { font-size:13px; font-weight:600; }
  .cal-ev { font-size:9px; padding:1px 4px; border-radius:3px; margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .cal-ev.lesson { background:#D6E4FF; color:#1A5BB5; }
  .cal-ev.trial { background:#FFF0D6; color:#B5771A; }
  .cal-ev.visit { background:#E8F8F0; color:#1A7B43; }
  .cal-legend { display:flex; gap:12px; margin:8px 16px 12px; font-size:11px; color:var(--text-sub); }
  .cal-legend span { display:flex; align-items:center; gap:3px; }
  .cal-legend .dot { width:10px; height:10px; border-radius:2px; display:inline-block; }

  /* Tab Bar */
  .tab-bar { position:fixed; bottom:0; left:0; right:0; height:64px; background:#fff; border-top:1px solid var(--border); display:flex; z-index:90; }
  .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--text-light); }
  .tab-item.active { color:var(--primary); }
  .tab-icon { font-size:22px; line-height:1; }
  .tab-label { font-size:10px; }

  /* Detail sheet */
  .detail-info { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:16px; }
  .detail-info .full { grid-column:span 2; }
  .detail-label { font-size:12px; color:var(--text-sub); }
  .detail-value { font-size:14px; font-weight:500; }
  .detail-box { background:var(--bg-page); padding:10px 12px; border-radius:8px; }
  .sub-list { margin-top:16px; }
  .sub-list-title { font-size:14px; font-weight:600; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .sub-list-item { padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:13px; }
  .sub-list-item:last-child { border:none; }
</style>
</head>

/* ===== XSS safety: escape any user-provided string before innerHTML ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== API ===== */

const API_BASE='https://education-api-306045-11-1478620475.sh.run.tcloudbase.com';

const API={async get(p){const r=await fetch(API_BASE+p,{credentials:'include'});if(!r.ok)throw new Error();return r.json();},async post(p,b){const r=await fetch(API_BASE+p,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'err');}return r.json();},async put(p,b){const r=await fetch(API_BASE+p,{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error();return r.json();},async del(p){const r=await fetch(API_BASE+p,{method:'DELETE',credentials:'include'});if(!r.ok)throw new Error();return r.json();}};

/* ===== Auth ===== */
async function boot(){
  try{ const me=await API.get('/api/me'); AUTH=me; showApp(); }
  catch(e){ showLogin(); }
}
function showLogin(){ document.getElementById('app').style.display='none'; document.getElementById('loginPage').style.display='flex'; applyLang(); }
function showApp(){ document.getElementById('loginPage').style.display='none'; document.getElementById('app').style.display='flex'; applyLang(); applyRoleUI(); renderAll(); }
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPwd').value;
  if(!u||!p){ alert('请输入用户名和密码'); return; }
  try{ const me=await API.post('/api/login',{username:u,password:p}); AUTH=me; document.getElementById('loginErr').textContent=''; showApp(); }
  catch(e){ document.getElementById('loginErr').textContent=t('loginError'); }
}
async function doLogout(){ try{ await API.post('/api/logout',{}); }catch(e){} AUTH={id:null,role:null,name:null}; showLogin(); }

// Toggle admin-only UI (Billing tab, revenue card, add-student button).
function applyRoleUI(){
  const isAdmin=AUTH.role==='admin';
  const tb=document.getElementById('tabBilling'); if(tb) tb.style.display=isAdmin?'':'none';
  const rc=document.getElementById('revCard'); if(rc) rc.style.display=isAdmin?'':'none';
  const ab=document.getElementById('addStuBtn'); if(ab) ab.style.display=isAdmin?'':'none';

/* ===== Tab Switch ===== */
function switchTab(page){
  if(page==='billing' && AUTH.role!=='admin') return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab-item[data-page="'+page+'"]').classList.add('active');
  const titles={dashboard:t('nav_dashboard'),students:t('nav_students'),billing:t('nav_billing'),calendar:t('nav_calendar')};
  document.getElementById('topbarTitle').textContent=titles[page]||'';
  if(page==='dashboard')renderDashboard();if(page==='students')renderStudents();if(page==='billing'){renderBilling();renderPayments();}if(page==='calendar')renderCalendar();
}

/* ===== Helpers ===== */
function gradeOpts(sel){const ks=['g_nursery','g_kindergarten','g_primary13','g_primary36','g_junior','g_senior','g_adult'];return ks.map(k=>'<option '+(sel===t(k)?'selected':'')+'>'+t(k)+'</option>').join('');}
function badge(rem,has){if(rem<=0&&has)return'<span class="badge badge-danger">'+t('bNoHrs')+'</span>';if(rem<=3&&rem>0)return'<span class="badge badge-warning">'+t('bLow')+'</span>';if(!has)return'<span class="badge badge-info">'+t('bNotPur')+'</span>';return'<span class="badge badge-success">'+t('bNormal')+'</span>';}
function closeSheet(){document.getElementById('sheetContainer').innerHTML='';}

/* ===== Dashboard ===== */
async function renderDashboard(){
  const d=_dashboard||await refreshDashboard();
  document.getElementById('statStudents').textContent=d.student_count;
  document.getElementById('statLessons').textContent=d.month_events;
  document.getElementById('statRevenue').textContent='¥'+d.total_revenue;
  document.getElementById('statWarning').textContent=d.warning_count;
  const wl=document.getElementById('warningList');
  if(d.warnings.length===0){wl.innerHTML='<div class="empty">'+t('noWarn')+'</div>';}
  else{wl.innerHTML=d.warnings.map(s=>'<div class="list-item" style="margin:0 0 8px;"><div class="li-row"><div class="li-main"><div class="li-title">'+esc(s.name)+'</div><div class="li-sub">'+(s.grade||'-')+'</div></div><div class="li-right"><div style="color:var(--danger);font-weight:700;font-size:18px;">'+s.remaining_hours+'</div><div style="font-size:11px;color:var(--text-sub)">'+t('remaining')+'</div></div></div></div>').join('');}
  const tl=document.getElementById('todayLessons');
  if(d.today_events.length===0){tl.innerHTML='<div class="empty">'+t('noToday')+'</div>';}
  else{tl.innerHTML=d.today_events.map(e=>{const cls=e.type==='lesson'?'badge-info':e.type==='trial'?'badge-warning':'badge-success';return '<div class="list-item" style="margin:0 0 8px;"><div class="li-row"><div class="li-main"><div class="li-title">'+esc(e.student_name||'-')+'</div><div class="li-sub">'+(e.time||'')+' '+esc(e.title||'')+'</div></div><div><span class="badge '+cls+'">'+t('ev_'+e.type)+'</span></div></div></div>';}).join('');}
}

/* ===== Students ===== */
function openStudentModal(id){
  const s=id?_students.find(x=>String(x.id)===String(id)):null;
  const html='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+(id?t('editStu'):t('addStu'))+'</h3>'+
    '<div class="form-group"><label>'+t('fName')+'</label><input type="text" id="sName" value="'+esc(s?.name||'')+'"></div>'+
    '<div class="form-group"><label>'+t('fGrade')+'</label><select id="sGrade">'+gradeOpts(s?.grade)+'</select></div>'+
    '<div class="form-group"><label>'+t('fAddress')+'</label><input type="text" id="sAddress" value="'+esc(s?.address||'')+'" placeholder="'+t('fAddressPh')+'"></div>'+
    '<div class="form-group"><label>'+t('fNeed')+'</label><textarea id="sNeed" placeholder="'+t('fNeedPh')+'">'+esc(s?.need||'')+'</textarea></div>'+
    '<div class="form-group"><label>'+t('fFeedback')+'</label><textarea id="sFeedback" placeholder="'+t('fFeedbackPh')+'">'+esc(s?.feedback||'')+'</textarea></div>'+
    '<div class="sheet-actions"><button class="btn btn-outline" onclick="closeSheet()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveStudent(\''+(id||'')+'\')">'+t('save')+'</button></div></div></div>';
  document.getElementById('sheetContainer').innerHTML=html;
}
async function saveStudent(id){
  const name=document.getElementById('sName').value.trim();if(!name){alert(t('enterName'));return;}
  const data={name,grade:document.getElementById('sGrade').value,address:document.getElementById('sAddress').value.trim(),need:document.getElementById('sNeed').value.trim(),feedback:document.getElementById('sFeedback').value.trim()};
  try{if(id)await API.put('/api/students/'+id,data);else await API.post('/api/students',data);closeSheet();await refreshStudents();renderStudents();renderDashboard();}catch(e){alert(t('saveErr'));}}
async function deleteStudent(id){if(!confirm(t('confirmDelStu')))return;try{await API.del('/api/students/'+id);await refreshStudents();renderStudents();renderDashboard();}catch{alert(t('delErr'));}}

function renderStudents(){
  const q=(document.getElementById('stuSearch')?.value||'').toLowerCase();
  let list=_students;if(q)list=list.filter(s=>s.name.toLowerCase().includes(q)||(s.address||'').toLowerCase().includes(q));
  const el=document.getElementById('stuList');
  if(list.length===0){el.innerHTML='<div class="empty">'+t('noStu')+'</div>';return;}
  const isAdmin=AUTH.role==='admin';
  el.innerHTML=list.map(s=>{
    const r=s.remaining_hours,warn=r<=3&&r>0,empty=r<=0;
    let actions='<button class="btn btn-outline btn-sm" onclick="viewStudentDetail('+s.id+')">'+t('detail')+'</button>';
    if(isAdmin){
      actions+='<button class="btn btn-outline btn-sm" onclick="openStudentModal('+s.id+')">'+t('edit')+'</button>';
      actions+='<button class="btn btn-outline btn-sm" style="color:var(--danger);border-color:var(--danger);" onclick="deleteStudent('+s.id+')">'+t('delete')+'</button>';
    } else {
      actions+='<button class="btn btn-outline btn-sm" onclick="openFeedbackModal('+s.id+')">'+t('feedback')+'</button>';
      actions+='<button class="btn btn-primary btn-sm" onclick="openDeductModal('+s.id+')">'+t('deduct')+'</button>';
    }
    return '<div class="list-item"><div class="li-row"><div class="li-main"><div class="li-title">'+esc(s.name)+'</div><div class="li-sub">'+esc(s.grade||'-')+' · '+esc(s.address||'-')+'</div></div><div class="li-right"><div style="font-weight:700;font-size:16px;color:'+(warn||empty?'var(--danger)':'var(--text-main)')+'">'+r+'</div><div style="font-size:11px;color:var(--text-sub)">'+t('remaining')+'</div></div></div>'+
      '<div class="li-actions">'+actions+'</div></div>';
  }).join('');
}

      (purchases.length===0?'<div class="empty" style="padding:16px;">'+t('noPurRec')+'</div>':purchases.map(p=>'<div class="sub-list-item"><span>'+String(p.date).slice(0,10)+'</span><span style="color:var(--success);font-weight:600;">¥'+p.amount+' ('+p.total_hours+t('lessonUnit')+')</span></div>').join(''))+
      '</div>':'')+
      '<div class="sheet-actions"><button class="btn btn-outline" onclick="closeSheet()">'+t('close')+'</button><button class="btn btn-primary" onclick="closeSheet();'+(isAdmin?'openStudentModal('+s.id+')':'openFeedbackModal('+s.id+')')+'">'+t('edit')+'</button></div></div></div>';
    document.getElementById('sheetContainer').innerHTML=html;
  }catch(e){alert('Error');}
}

/* ===== Teacher: feedback only ===== */
function openFeedbackModal(id){
  const s=_students.find(x=>String(x.id)===String(id));
  const html='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+t('writeFeedback')+'</h3>'+
    '<div class="form-group"><label>'+t('fFeedback')+'</label><textarea id="fbf" placeholder="'+t('fFeedbackPh')+'">'+esc(s?.feedback||'')+'</textarea></div>'+
    '<div class="sheet-actions"><button class="btn btn-outline" onclick="closeSheet()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveFeedback('+id+')">'+t('save')+'</button></div></div></div>';
  document.getElementById('sheetContainer').innerHTML=html;
}
async function saveFeedback(id){
  const fb=document.getElementById('fbf').value;
  try{ await API.put('/api/students/'+id,{feedback:fb}); closeSheet(); await refreshStudents(); renderStudents(); }catch(e){ alert(t('saveErr')); }
}

/* ===== Billing ===== */
async function openPurchaseModal(){
  if(_students.length===0){alert(t('addStuFirst'));return;}
  const html='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+t('purTitle')+'</h3>'+
    '<div class="form-group"><label>'+t('fStudent')+'</label><select id="pStudent">'+_students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' ('+t('remHrs')+' '+s.remaining_hours+')</option>').join('')+'</select></div>'+
    '<div class="form-row"><div class="form-group"><label>'+t('fAmount')+'</label><input type="number" id="pAmount"></div><div class="form-group"><label>'+t('fHrs')+'</label><input type="number" id="pHours"></div></div>'+
    '<div class="form-group"><label>'+t('fNote')+'</label><input type="text" id="pNote"></div>'+
    '<div class="sheet-actions"><button class="btn btn-outline" onclick="closeSheet()">'+t('cancel')+'</button><button class="btn btn-success" onclick="savePurchase()">'+t('save')+'</button></div></div></div>';
  document.getElementById('sheetContainer').innerHTML=html;
}
async function savePurchase(){
  const sid=parseInt(document.getElementById('pStudent').value),amt=parseFloat(document.getElementById('pAmount').value),hrs=parseFloat(document.getElementById('pHours').value),note=document.getElementById('pNote').value.trim();
  if(!amt||amt<=0){alert(t('enterAmt'));return;}if(!hrs||hrs<=0){alert(t('enterHrs'));return;}
  try{await API.post('/api/purchases',{student_id:sid,amount:amt,total_hours:hrs,note});closeSheet();await refreshStudents();await refreshBilling();await refreshPurchases();renderBilling();renderPayments();renderDashboard();}catch(e){alert(e.message);}}
async function openDeductModal(presetSid){
  if(_students.length===0){alert(t('addStuFirst'));return;}
  const html='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+t('dedTitle')+'</h3>'+
    '<div class="form-group"><label>'+t('fStudent')+'</label><select id="dStudent" '+(presetSid?'disabled':'')+'>'+_students.map(s=>'<option value="'+s.id+'" '+(presetSid==s.id?'selected':'')+'>'+esc(s.name)+' ('+t('remHrs')+' '+s.remaining_hours+')</option>').join('')+'</select></div>'+
    '<div class="form-row"><div class="form-group"><label>'+t('fDedHrs')+'</label><input type="number" id="dHours" value="1" step="0.5"></div><div class="form-group"><label>'+t('fLesDate')+'</label><input type="date" id="dDate" value="'+new Date().toISOString().slice(0,10)+'"></div></div>'+
    '<div class="form-group"><label>'+t('fNote')+'</label><input type="text" id="dNote"></div>'+
    '<div class="sheet-actions"><button class="btn btn-outline" onclick="closeSheet()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveDeduction()">'+t('confirm')+'</button></div></div></div>';
  document.getElementById('sheetContainer').innerHTML=html;
}
async function saveDeduction(){
  const sid=parseInt(document.getElementById('dStudent').value),hrs=parseFloat(document.getElementById('dHours').value),date=document.getElementById('dDate').value,note=document.getElementById('dNote').value.trim();
  if(!hrs||hrs<=0){alert(t('enterHrs'));return;}
  try{await API.post('/api/deductions',{student_id:sid,hours,date,note});closeSheet();await refreshStudents();if(AUTH.role==='admin'){await refreshBilling();renderBilling();}renderDashboard();}catch(e){alert(e.message);}}
function renderBilling(){
  const q=(document.getElementById('bilSearch')?.value||'').toLowerCase();
  let list=_billing;if(q)list=list.filter(s=>s.name.toLowerCase().includes(q));
  const el=document.getElementById('bilList');
  if(list.length===0){el.innerHTML='<div class="empty">'+t('noStu2')+'</div>';return;}
  el.innerHTML=list.map(s=>{
    const r=s.remaining_hours,warn=r<=3&&r>0,empty=r<=0;
    return '<div class="list-item"><div class="li-row"><div class="li-main"><div class="li-title">'+esc(s.name)+'</div><div class="li-sub">'+(s.grade||'-')+' · ¥'+s.total_amount+' · '+s.total_hours+t('lessonUnit')+'</div></div><div class="li-right"><div style="font-weight:700;font-size:16px;color:'+(warn||empty?'var(--danger)':'var(--text-main)')+'">'+r+'</div><div style="font-size:11px;color:var(--text-sub)">'+t('remaining')+'</div></div></div>'+
      '<div class="li-sub" style="margin-top:6px;">'+t('used')+': '+s.used_hours+' · '+t('unit')+': ¥'+s.unit_price+t('perHr')+' · '+badge(r,s.has_purchased)+'</div>'+
      '<div class="li-actions"><button class="btn btn-success btn-sm" onclick="openPurFor('+s.id+')">'+t('buy')+'</button><button class="btn btn-primary btn-sm" onclick="openDedFor('+s.id+')">'+t('deduct')+'</button><button class="btn btn-outline btn-sm" onclick="viewStudentDetail('+s.id+')">'+t('detail')+'</button></div></div>';
  }).join('');
}
function openPurFor(sid){openPurchaseModal();setTimeout(()=>{document.getElementById('pStudent').value=sid;},0);}
function openDedFor(sid){openDeductModal(sid);}

function renderPayments(){
  const q=(document.getElementById('paySearch')?.value||'').toLowerCase();
  let list=[..._purchases].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(q)list=list.filter(p=>(p.student_name||'').toLowerCase().includes(q));
  const el=document.getElementById('payList');
  if(list.length===0){el.innerHTML='<div class="empty">'+t('noPay')+'</div>';return;}
  el.innerHTML=list.map(p=>{
    const unit=p.total_hours>0?Math.round(p.amount/p.total_hours):0;
    return '<div class="list-item"><div class="li-row"><div class="li-main"><div class="li-title">'+esc(p.student_name||t('deleted'))+'</div><div class="li-sub">'+String(p.date).slice(0,10)+' · '+p.total_hours+t('lessonUnit')+' · ¥'+unit+t('perHr')+'</div></div><div class="li-right" style="color:var(--success);font-weight:700;font-size:16px;">¥'+p.amount+'</div></div>'+(p.note?'<div class="li-sub" style="margin-top:4px;">'+esc(p.note)+'</div>':'')+'</div>';
  }).join('');
}

/* ===== Calendar ===== */
let calDate=new Date();
function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const mn=LANG==='zh'?['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('calMonthLabel').textContent=y+t('yearSuffix')+' '+mn[m];
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate(),daysInPrev=new Date(y,m,0).getDate();
  const wd=LANG==='zh'?['日','一','二','三','四','五','六']:['S','M','T','W','T','F','S'];
  let html='';wd.forEach(d=>html+='<div class="cal-wd">'+d+'</div>');
  const todayStr=new Date().toISOString().slice(0,10);
  for(let i=firstDay-1;i>=0;i--)html+='<div class="cal-day other"><div class="cal-day-num">'+(daysInPrev-i)+'</div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs=_events.filter(e=>e.date===ds);
    let evHtml=evs.slice(0,2).map(e=>{const cls=e.type==='lesson'?'lesson':e.type==='trial'?'trial':'visit';const sn=e.student_name||e.title||'';return '<div class="cal-ev '+cls+'">'+(e.time||'')+' '+esc(sn)+'</div>';}).join('');
    html+='<div class="cal-day '+(ds===todayStr?'today':'')+'" onclick="openEventModal(\'\',\'lesson\',\''+ds+'\')"><div class="cal-day-num">'+d+'</div>'+evHtml+'</div>';
  }
  const rem=(7-((firstDay+daysInMonth)%7))%7;
  for(let i=1;i<=rem;i++)html+='<div class="cal-day other"><div class="cal-day-num">'+i+'</div></div>';
  document.getElementById('calGrid').innerHTML=html;
}
function changeMonth(d){calDate.setMonth(calDate.getMonth()+d);renderCalendar();}

function openEventModal(id,type,presetDate){
  const ev=id?_events.find(e=>e.id===id):null;
  const dd=presetDate||ev?.date||new Date().toISOString().slice(0,10);
  const dt=type||ev?.type||'lesson';
  const tk='ev_'+dt;
  const html='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><h3>'+(id?t('evEdit'):t('evAdd'))+t(tk)+'</h3>'+
    '<div class="form-group"><label>'+t('fType')+'</label><select id="eType"><option value="lesson" '+(dt==='lesson'?'selected':'')+'>'+t('evLesson')+'</option><option value="trial" '+(dt==='trial'?'selected':'')+'>'+t('evTrial')+'</option><option value="visit" '+(dt==='visit'?'selected':'')+'>'+t('evVisit')+'</option></select></div>'+
    '<div class="form-group"><label>'+t('fBind')+'</label><select id="eStudent"><option value="">'+t('noBind')+'</option>'+_students.map(s=>'<option value="'+s.id+'" '+(ev&&ev.student_id===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></div>'+
    '<div class="form-row"><div class="form-group"><label>'+t('fDate')+'</label><input type="date" id="eDate" value="'+dd+'"></div><div class="form-group"><label>'+t('fTime')+'</label><input type="time" id="eTime" value="'+(ev?.time||'')+'"></div></div>'+
    '<div class="form-group"><label>'+t('fTitle')+'</label><input type="text" id="eTitle" value="'+esc(ev?.title||'')+'" placeholder="'+t('fTitlePh')+'"></div>'+
    '<div class="sheet-actions">'+(id?'<button class="btn btn-danger" onclick="deleteEvent('+id+')" style="flex:0 0 auto;">'+t('delete')+'</button>':'')+'<button class="btn btn-outline" onclick="closeSheet()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveEvent('+(id||'\'\'')+')">'+t('save')+'</button></div></div></div>';
  document.getElementById('sheetContainer').innerHTML=html;
}
async function saveEvent(id){
  const type=document.getElementById('eType').value,sid=document.getElementById('eStudent').value?parseInt(document.getElementById('eStudent').value):null;
  const date=document.getElementById('eDate').value,time=document.getElementById('eTime').value,title=document.getElementById('eTitle').value.trim();
  if(!date){alert(t('selDate'));return;}
  try{if(id)await API.put('/api/events/'+id,{type,student_id:sid,date,time,title});else await API.post('/api/events',{type,student_id:sid,date,time,title});closeSheet();await refreshEvents();renderCalendar();renderDashboard();}catch(e){alert(e.message);}}
async function deleteEvent(id){if(!confirm(t('confirmDelEv')))return;try{await API.del('/api/events/'+id);closeSheet();await refreshEvents();renderCalendar();renderDashboard();}catch{alert(t('delErr'));}}

/* ===== Render All ===== */
async function renderAll(){
  try{
    await refreshStudents();
    await refreshDashboard();
    renderDashboard(); renderStudents();
    if(AUTH.role==='admin'){
      await refreshBilling(); await refreshPurchases();
      renderBilling(); renderPayments();
    }
    await refreshEvents(); renderCalendar();
  }catch(e){console.error(e);}
}

/* ===== Init ===== */
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
